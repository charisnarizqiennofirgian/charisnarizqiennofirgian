name: Generate Rainbow Snake

on:
  schedule:
    - cron: "0 0 * * *" # jalan otomatis tiap hari jam 00:00 UTC
  workflow_dispatch: {} # supaya bisa dijalankan manual juga
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate rainbow snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: charisnarizqiennofirgian
          outputs: |
            dist/github-contribution-grid-snake-rainbow.svg?color_snake=%23ffffff&color_dots=%230d1117,%23ff6b6b,%23ffa94d,%2300b4d8,%239b5de5

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
